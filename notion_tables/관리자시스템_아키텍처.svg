<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img">
  <title>관리자·운영 관리 시스템 아키텍처</title>
  <desc>Frontend 관리자 콘솔, Backend FastAPI(미들웨어·서비스·Streamer), PostgreSQL 테이블로 이어지는 검증된 데이터 흐름</desc>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arwR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d93025"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933">관리자 · 운영 관리 시스템 아키텍처</text>

  <!-- FRONTEND -->
  <rect x="30" y="52" width="940" height="92" rx="10" fill="#eaf2fe" stroke="#3b6fb0" stroke-width="1.5"/>
  <text x="46" y="72" font-size="12" font-weight="700" fill="#3b6fb0">FRONTEND · React</text>
  <g font-size="13.5" fill="#1f2933">
    <rect x="60" y="84" width="270" height="46" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.3"/>
    <text x="195" y="104" text-anchor="middle" font-weight="600">AdminDashboard</text>
    <text x="195" y="121" text-anchor="middle" font-size="11" fill="#5f6b7a">계정 · 승인 · KPI</text>
    <rect x="375" y="84" width="250" height="46" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.3"/>
    <text x="500" y="104" text-anchor="middle" font-weight="600">TelemetryAdmin</text>
    <text x="500" y="121" text-anchor="middle" font-size="11" fill="#5f6b7a">실시간 모니터</text>
    <rect x="670" y="84" width="270" height="46" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.3"/>
    <text x="805" y="104" text-anchor="middle" font-weight="600">IncidentList</text>
    <text x="805" y="121" text-anchor="middle" font-size="11" fill="#5f6b7a">장애 · 리포트</text>
  </g>

  <line x1="500" y1="144" x2="500" y2="176" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="512" y="165" font-size="11" fill="#5f6b7a">REST · JWT(RS256)</text>

  <!-- BACKEND -->
  <rect x="30" y="180" width="940" height="300" rx="10" fill="#e7f6ec" stroke="#2f9e54" stroke-width="1.5"/>
  <text x="46" y="200" font-size="12" font-weight="700" fill="#2f9e54">BACKEND · FastAPI</text>

  <!-- entry chain -->
  <g font-size="12.5" fill="#1f2933">
    <rect x="60" y="212" width="110" height="40" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="115" y="237" text-anchor="middle">CORS</text>
    <line x1="170" y1="232" x2="196" y2="232" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>
    <rect x="200" y="212" width="240" height="40" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.5"/>
    <text x="320" y="231" text-anchor="middle" font-weight="600">TelemetryMiddleware</text>
    <text x="320" y="246" text-anchor="middle" font-size="10.5" fill="#5f6b7a">요청 수집 · ID · 세션 · 응답시간</text>
    <line x1="440" y1="232" x2="466" y2="232" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>
    <rect x="470" y="212" width="110" height="40" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="525" y="237" text-anchor="middle">Router</text>
  </g>

  <!-- handlers -->
  <g font-size="13" fill="#1f2933">
    <rect x="60" y="292" width="270" height="54" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.3"/>
    <text x="195" y="313" text-anchor="middle" font-weight="600">AuthService · RBAC</text>
    <text x="195" y="331" text-anchor="middle" font-size="11" fill="#5f6b7a">승인 · 권한 · 로그인 · JWT</text>
    <rect x="670" y="292" width="270" height="54" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.3"/>
    <text x="805" y="313" text-anchor="middle" font-weight="600">AuditService</text>
    <text x="805" y="331" text-anchor="middle" font-size="11" fill="#5f6b7a">서비스가 직접 호출 (미들웨어 아님)</text>
  </g>

  <!-- streamer -->
  <rect x="200" y="392" width="240" height="52" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.3"/>
  <text x="320" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">Streamer</text>
  <text x="320" y="431" text-anchor="middle" font-size="11" fill="#5f6b7a">asyncio Queue → batch(500/1s)</text>

  <!-- backend internal arrows -->
  <line x1="525" y1="252" x2="230" y2="290" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="525" y1="252" x2="790" y2="290" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="320" y1="252" x2="320" y2="390" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="330" y="330" font-size="10.5" fill="#5f6b7a">비동기 push</text>

  <!-- BACKEND -> DB arrows -->
  <line x1="195" y1="346" x2="230" y2="560" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="320" y1="444" x2="560" y2="560" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="360" y1="444" x2="705" y2="560" stroke="#d93025" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwR)"/>
  <text x="470" y="512" font-size="10.5" fill="#d93025">실패 시(DLQ)</text>
  <line x1="805" y1="346" x2="865" y2="560" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- DB -->
  <rect x="30" y="516" width="940" height="196" rx="10" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/>
  <text x="46" y="536" font-size="12" font-weight="700" fill="#6b7280">PostgreSQL</text>
  <text x="150" y="536" font-size="11" fill="#3b6fb0">■ RBAC</text>
  <text x="560" y="536" font-size="11" fill="#2f9e54">■ 운영/감사</text>

  <g font-size="12.5" fill="#1f2933">
    <!-- RBAC tables -->
    <rect x="55" y="548" width="150" height="70" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.2"/>
    <text x="130" y="578" text-anchor="middle" font-weight="600">users</text>
    <text x="130" y="596" text-anchor="middle" font-size="10.5" fill="#5f6b7a">approval · role</text>
    <rect x="215" y="548" width="150" height="70" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.2"/>
    <text x="290" y="578" text-anchor="middle" font-weight="600" font-size="11.5">approval_history</text>
    <text x="290" y="596" text-anchor="middle" font-size="10.5" fill="#5f6b7a">old → new</text>
    <rect x="375" y="548" width="150" height="70" rx="8" fill="#ffffff" stroke="#3b6fb0" stroke-width="1.2"/>
    <text x="450" y="578" text-anchor="middle" font-weight="600" font-size="12">user_sessions</text>
    <text x="450" y="596" text-anchor="middle" font-size="10.5" fill="#5f6b7a">JWT 세션</text>
    <!-- ops tables -->
    <rect x="545" y="548" width="150" height="70" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.2"/>
    <text x="620" y="578" text-anchor="middle" font-weight="600">request_logs</text>
    <text x="620" y="596" text-anchor="middle" font-size="10.5" fill="#5f6b7a">텔레메트리</text>
    <rect x="705" y="548" width="150" height="70" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
    <text x="780" y="575" text-anchor="middle" font-weight="600" font-size="11.5">request_logs_dlq</text>
    <text x="780" y="596" text-anchor="middle" font-size="10.5" fill="#c5221f">유실 방지</text>
    <rect x="865" y="548" width="105" height="70" rx="8" fill="#ffffff" stroke="#2f9e54" stroke-width="1.2"/>
    <text x="917" y="578" text-anchor="middle" font-weight="600" font-size="12">audit_logs</text>
    <text x="917" y="596" text-anchor="middle" font-size="10.5" fill="#5f6b7a">감사</text>
  </g>

  <text x="500" y="734" text-anchor="middle" font-size="10.5" fill="#8a94a3">검증 기준: auth_service.py · telemetry/streamer.py(request_logs) · models/audit.py · main.py(add_middleware)</text>
</svg>
